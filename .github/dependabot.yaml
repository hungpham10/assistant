# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-

version: 2
updates:
  - package-ecosystem: bun
    directory: .github/actions/codex
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directories:
      - codex-rs
      - codex-rs/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # 0.7+ depends on `ratatui-core`, but `[patch.crates-io]` pins ratatui to
      # a pre-modularization 0.29 fork whose `text::Span`/`text::Line` are a
      # different type. Re-enable once the patched ratatui re-exports
      # `ratatui-core`.
      - dependency-name: ratatui-macros
        versions: [">= 0.7.0"]
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: codex-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: rust-toolchain
    directory: codex-rs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
