name: README translations

on:
  pull_request:
    paths:
      - README.md
      - README_ES.md
      - README_ZH.md
      - .github/scripts/check_readme_translations.py
      - .github/workflows/readme-translations.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - README_ES.md
      - README_ZH.md
      - .github/scripts/check_readme_translations.py
      - .github/workflows/readme-translations.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check translated READMEs
        run: python3 .github/scripts/check_readme_translations.py
