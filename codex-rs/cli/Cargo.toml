[package]
name = "codex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "codex"
path = "src/main.rs"

[lib]
name = "codex_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
# Giữ nguyên hành vi hiện tại cho dev/CI/Bazel.
default = ["full"]

# Toàn bộ surface như upstream.
full = [
    "app-server",
    "mcp-server",
    "cloud",
    "apply",
    "plugins",
    "session-management",
    "exec-server",
    "internal-tools",
    "desktop-app",
]

# Console-only: TUI + exec + review + login + logout + completion + update
# + doctor + sandbox + resume + usage + features.
minimal = []

app-server = [
    "dep:codex-app-server",
    "dep:codex-app-server-daemon",
    "dep:codex-app-server-test-client",
]
mcp-server = ["dep:codex-mcp-server"]
cloud = ["dep:codex-cloud-tasks"]
apply = ["dep:codex-chatgpt"]
internal-tools = [
    "dep:codex-responses-api-proxy",
    "dep:codex-stdio-to-uds",
    "dep:codex-memories-write",
]
# Các feature dưới đây chỉ gate code, không kéo crate riêng.
plugins = []
session-management = []
exec-server = []
desktop-app = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
codex-app-server = { workspace = true, optional = true }
codex-app-server-daemon = { workspace = true, optional = true }
codex-app-server-protocol = { workspace = true }
codex-app-server-test-client = { workspace = true, optional = true }
codex-arg0 = { workspace = true }
codex-api = { workspace = true }
codex-chatgpt = { workspace = true, optional = true }
codex-cloud-tasks = { workspace = true, optional = true }
codex-utils-cli = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-core-plugins = { workspace = true }
codex-home = { workspace = true }
codex-exec = { workspace = true }
codex-exec-server = { workspace = true }
codex-execpolicy = { workspace = true }
codex-features = { workspace = true }
codex-git-utils = { workspace = true }
codex-install-context = { workspace = true }
codex-login = { workspace = true }
codex-memories-write = { workspace = true, optional = true }
codex-mcp = { workspace = true }
codex-mcp-server = { workspace = true, optional = true }
codex-model-provider = { workspace = true }
codex-models-manager = { workspace = true }
codex-plugin = { workspace = true }
codex-product-info = { workspace = true }
codex-protocol = { workspace = true }
codex-responses-api-proxy = { workspace = true, optional = true }
codex-rmcp-client = { workspace = true }
codex-rollout = { workspace = true }
codex-rollout-trace = { workspace = true }
codex-sandboxing = { workspace = true }
codex-state = { workspace = true }
codex-stdio-to-uds = { workspace = true, optional = true }
codex-terminal-detection = { workspace = true }
codex-tui = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
codex_windows_sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
app_test_support = { workspace = true }
agent-client-protocol = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
wiremock = { workspace = true }

[[test]]
name = "app_server"
path = "tests/app_server.rs"
required-features = ["app-server"]

[[test]]
name = "exec_server"
path = "tests/exec_server.rs"
required-features = ["exec-server"]

[[test]]
name = "features"
path = "tests/features.rs"
required-features = ["mcp-server"]

[[test]]
name = "acp_protocol"
path = "tests/acp_protocol.rs"

[[test]]
name = "debug_clear_memories"
path = "tests/debug_clear_memories.rs"
required-features = ["internal-tools"]
