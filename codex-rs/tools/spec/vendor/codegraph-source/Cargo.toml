[package]
name = "codegraph-source"
version = "2.2.14"
edition = "2024"
license = "MIT"

[dependencies]
codegraph-core = { path = "../codegraph-core" }
async-trait = "0.1"
camino = { version = "1.1", features = ["serde1"] }
ignore = "0.4"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
