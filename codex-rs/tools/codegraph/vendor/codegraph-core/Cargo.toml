[package]
name = "codegraph-core"
version = "2.2.14"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
camino = { version = "1.1", features = ["serde1"] }
async-graphql = { version = "7", optional = true, features = ["chrono", "uuid"] }

[features]
graphql = ["async-graphql"]
