[package]
name = "codegraph-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
codegraph-core     = { path = "../codegraph-core" }
# sqlite + lmdb: both on-disk backends a workspace's [storage] type may select
# (`sqlite://` / `lmdb://` DSNs). The other backends (redis/postgres/mysql)
# stay opt-in so the agent binary never links their drivers by default.
codegraph-graph    = { path = "../codegraph-graph", features = ["sqlite", "lmdb"] }
codegraph-context  = { path = "../codegraph-context" }
codegraph-extract  = { path = "../codegraph-extract", default-features = false, features = ["all-langs"] }
codegraph-source   = { path = "../codegraph-source" }
camino = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = "3"
camino = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
# fastembed (semantic search / ONNX embedding) LÀ OPT-IN — KHÔNG bật mặc định.
default = []
fastembed = ["codegraph-graph/fastembed"]
