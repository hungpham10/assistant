# Write source code grounded in the document graph: consult docs and related
# symbols first, draft with patches, then verify. All values are
# initialization data (suggestions) — the harness loop adapts them.

[strategy]
name = "write-code"
description = "Write code grounded in docs and existing structure"

[origin]
ground = 0.7
draft = 0.3

[node.ground]
guidance = "Ground the change first: search the doc graph and related symbols for conventions the edit must follow. Missing docs are fine; note that and move on."
tools = { "docgraph.search" = 1.5, "codegraph.doc_search" = 1.4, "codegraph.context" = 1.3, "codegraph.search_symbol" = 1.1 }
budget = 3
backtrack_to = "origin"

[[node.ground.edges]]
to = "draft"
when = "always"
likelihood = 1.0

[node.draft]
guidance = "Draft the edit with apply_patch in small steps. Re-check impact of touched symbols before finalizing. Failing tests or broken references send you back to ground."
tools = { "apply_patch" = 1.8, "codegraph.impact" = 1.2, "shell" = 1.2 }
budget = 6
backtrack_to = "ground"

[[node.draft.edges]]
to = "verify"
when = "tool_result:shell:nonempty"
likelihood = 0.5

[node.verify]
guidance = "Run the relevant tests for the touched crate. Failures loop back into drafting with a narrower patch."
tools = { "shell" = 1.7, "apply_patch" = 1.2 }
budget = 4
backtrack_to = "draft"

[[node.verify.edges]]
to = "draft"
when = "tool_result:shell:error"
likelihood = 0.7

[node.done]
guidance = "Summarize what changed and which docs/conventions were followed."
tools = {}
budget = 1
backtrack_to = "verify"
terminal = true
