[package]
name = "codex-network-proxy"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "codex_network_proxy"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
globset = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }
rama-core = { version = "0.4.0" }
rama-crypto = { version = "0.4.0", features = ["ring"] }
rama-dns = { version = "0.4.0" }
rama-http = { version = "0.4.0" }
rama-http-backend = { version = "0.4.0", features = ["tls"] }
rama-net = { version = "0.4.0", features = ["http"] }
rama-socks5 = { version = "0.4.0", features = ["dns"] }
rama-tcp = { version = "0.4.0" }
rama-tls = { version = "0.4.0" }
rama-tls-rustls = { version = "0.4.0", features = ["http", "ring"] }
rustls-native-certs = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_family = "unix")'.dependencies]
rama-unix = { version = "0.4.0" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
schannel = "0.1"
