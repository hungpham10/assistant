[package]
name = "codex-feedback"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-login = { workspace = true }
codex-protocol = { workspace = true }
# Sentry crash/feedback upload is disabled by default in this fork to keep
# builds lean; re-enable with `--features codex-feedback/sentry`.
sentry = { version = "0.46", optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
sentry = ["dep:sentry"]

[dev-dependencies]
pretty_assertions = { workspace = true }

[lib]
doctest = false
